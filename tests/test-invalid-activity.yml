name: Test invalid ACTIVITY is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ github.token }}
          ACTIVITY: not_a_real_activity
      - name: Assert action failed on config validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ACTIVITY_RUN: ${{ steps.action.outputs.activity_run }}
        run: |
          echo "outcome: $OUTCOME"
          echo "activity_run: $ACTIVITY_RUN"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid ACTIVITY"
            exit 1
          fi
          if [ -n "$ACTIVITY_RUN" ]; then
            echo "FAIL: activity_run should not be set"
            exit 1
          fi
          echo "PASS"
