name: Test post_comment activity fails gracefully without GITHUB_PR_RUN_ID
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The post_comment activity requires GITHUB_PR_RUN_ID.
      # The action also calls the GitHub API (get_repository_info) which will fail
      # with the sentinel GITHUB_REPOSITORY. Either way, the action should fail.
      - id: action
        uses: .
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ github.token }}
          ACTIVITY: post_comment
          # Intentionally omitting GITHUB_PR_RUN_ID to test error handling

      - name: Assert action fails gracefully
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because:
          # 1. The sentinel GITHUB_REPOSITORY causes a 404 on the GitHub API, OR
          # 2. GITHUB_PR_RUN_ID is missing (required for post_comment activity)
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (missing GITHUB_PR_RUN_ID or sentinel repo)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed without GITHUB_PR_RUN_ID"
            exit 1
          elif [ "$OUTCOME" = "skipped" ] || [ -z "$OUTCOME" ]; then
            echo "PASS: action step was skipped or outcome not available (Docker build may have failed)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
