name: Test post_comment activity with missing GITHUB_PR_RUN_ID
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ github.token }}
          ACTIVITY: post_comment
          # Intentionally omitting GITHUB_PR_RUN_ID to test error handling

      - name: Assert action fails when GITHUB_PR_RUN_ID is missing
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because GITHUB_PR_RUN_ID is required for post_comment
          # (or fail due to sentinel repo not being resolvable)
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed (missing GITHUB_PR_RUN_ID or sentinel repo)"
          elif [ "$OUTCOME" = "skipped" ] || [ "$OUTCOME" = "cancelled" ] || [ -z "$OUTCOME" ]; then
            echo "PASS: action step was not executed (Docker build or infrastructure issue)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed without GITHUB_PR_RUN_ID"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
