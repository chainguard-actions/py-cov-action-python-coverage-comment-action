name: Test post_comment without GITHUB_PR_RUN_ID fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ github.token }}
          ACTIVITY: post_comment
      - name: Assert action failed and did not report post_comment
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.activity_run }}
        run: |
          echo "outcome: $OUTCOME"
          echo "activity_run: $RESULT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when GITHUB_PR_RUN_ID is missing"
            exit 1
          fi
          if [ "$RESULT" = "post_comment" ]; then
            echo "FAIL: post_comment should not have completed"
            exit 1
          fi
          echo "PASS"
