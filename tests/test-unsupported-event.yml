name: Test unsupported event type
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: workflow_dispatch
      GITHUB_REF: refs/heads/main
      GITHUB_REPOSITORY: test-owner/test-repo
      GITHUB_BASE_REF: main
      GITHUB_STEP_SUMMARY: /tmp/step-summary.md
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create step summary file
        run: |
          touch /tmp/step-summary.md

      - name: Run action with unsupported event (workflow_dispatch)
        id: action
        uses: .
        continue-on-error: true
        with:
          GITHUB_TOKEN: fake-token-for-testing

      - name: Assert action failed with unsupported event
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for unsupported event type 'workflow_dispatch'"
            exit 1
          fi
          echo "PASS: action correctly failed for unsupported event type"
