name: Test pull request mode (process_pr)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python and create coverage file
        run: |
          python3 -m pip install coverage --quiet
          # Configure coverage to use relative paths (required for Docker container compatibility)
          cat > .coveragerc << 'EOF'
          [run]
          relative_files = true
          EOF
          python3 -c "
          import coverage
          cov = coverage.Coverage(data_file='.coverage', config_file='.coveragerc')
          cov.start()
          x = 1 + 1
          y = x * 2
          cov.stop()
          cov.save()
          print('Coverage file created')
          "
          ls -la .coverage

      - name: Run action in PR mode
        id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_NAME: pull_request
          GITHUB_REF: refs/pull/1/merge
          GITHUB_BASE_REF: main
          GITHUB_STEP_SUMMARY: /dev/null
        with:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert PR mode ran correctly
        env:
          ACTIVITY: ${{ steps.action.outputs.activity_run }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "activity_run: $ACTIVITY"
          # In PR mode, the action processes the PR and sets activity_run=process_pr
          # It may fail if PR #1 doesn't exist or there are permission issues,
          # but if it succeeds, activity_run must be process_pr
          if [ "$OUTCOME" = "success" ]; then
            if [ "$ACTIVITY" != "process_pr" ]; then
              echo "FAIL: expected activity_run='process_pr', got '$ACTIVITY'"
              exit 1
            fi
            echo "PASS: activity_run is process_pr"
          else
            echo "INFO: action failed (possibly because PR #1 doesn't exist or coverage data issues)"
            echo "PASS: action ran in pull_request mode"
          fi
