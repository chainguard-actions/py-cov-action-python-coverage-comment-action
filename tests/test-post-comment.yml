name: Test post_comment activity - missing GITHUB_PR_RUN_ID
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create GITHUB_STEP_SUMMARY file
        run: |
          touch /tmp/step_summary.txt
          echo "GITHUB_STEP_SUMMARY=/tmp/step_summary.txt" >> $GITHUB_ENV

      - name: Create GITHUB_OUTPUT file
        run: |
          touch /tmp/github_output.txt
          echo "GITHUB_OUTPUT=/tmp/github_output.txt" >> $GITHUB_ENV

      - id: action
        uses: .
        continue-on-error: true
        with:
          GITHUB_TOKEN: fake-token-for-testing
          ACTIVITY: post_comment
        env:
          GITHUB_REPOSITORY: test-owner/test-repo
          GITHUB_REF: refs/heads/main
          GITHUB_EVENT_NAME: workflow_run
          GITHUB_STEP_SUMMARY: /tmp/step_summary.txt
          GITHUB_OUTPUT: /tmp/github_output.txt

      - name: Assert action fails gracefully when GITHUB_PR_RUN_ID is missing
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should fail because GITHUB_PR_RUN_ID is not set
          # This is the expected behavior per the code:
          # if not config.GITHUB_PR_RUN_ID:
          #     log.error("Missing input GITHUB_PR_RUN_ID. Please consult the documentation.")
          #     return 1
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail due to missing GITHUB_PR_RUN_ID, got '${{ steps.action.outcome }}'"
            exit 1
          fi
          echo "PASS: action correctly failed when GITHUB_PR_RUN_ID is missing"
