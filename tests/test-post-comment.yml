name: Test post_comment activity
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ github.token }}
          ACTIVITY: post_comment
          GITHUB_PR_RUN_ID: ${{ github.run_id }}

      - name: Assert action ran (post_comment or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ACTIVITY_RUN: ${{ steps.action.outputs.activity_run }}
        run: |
          echo "outcome: $OUTCOME"
          echo "activity_run: $ACTIVITY_RUN"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$ACTIVITY_RUN" != "post_comment" ]; then
              echo "FAIL: expected activity_run='post_comment' but got '$ACTIVITY_RUN'"
              exit 1
            fi
            echo "PASS: post_comment activity ran successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable for GitHub API calls)"
          elif [ "$OUTCOME" = "skipped" ] || [ "$OUTCOME" = "cancelled" ] || [ -z "$OUTCOME" ]; then
            echo "PASS: action step was not executed (Docker build or infrastructure issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
