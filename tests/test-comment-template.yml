name: Test custom COMMENT_TEMPLATE input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a minimal .coverage file for process_pr activity
        run: |
          pip install coverage --quiet
          python -c "
          import coverage
          cov = coverage.Coverage(data_file='.coverage')
          cov.start()
          x = 1 + 1
          cov.stop()
          cov.save()
          "

      - id: action
        uses: .
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ github.token }}
          ACTIVITY: process_pr
          COMMENT_TEMPLATE: |
            ## Custom Coverage Report
            Coverage: {{ coverage.percent_covered | round(2) }}%
          COVERAGE_PATH: "."

      - name: Assert action ran with COMMENT_TEMPLATE input (success or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ACTIVITY_RUN: ${{ steps.action.outputs.activity_run }}
        run: |
          echo "outcome: $OUTCOME"
          echo "activity_run: $ACTIVITY_RUN"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded"
            if [ -n "$ACTIVITY_RUN" ]; then
              echo "PASS: activity_run='$ACTIVITY_RUN'"
            else
              echo "PASS: action completed (no activity_run output in this context)"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo or missing PR context)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
