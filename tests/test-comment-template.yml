name: Test COMMENT_TEMPLATE input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ github.token }}
          COMMENT_TEMPLATE: |
            ## Coverage Report
            {{ coverage_report }}
          COVERAGE_PATH: "."
      - name: Assert action ran (unsupported event is acceptable)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ACTIVITY: ${{ steps.action.outputs.activity_run }}
        run: |
          echo "outcome: $OUTCOME"
          echo "activity_run: $ACTIVITY"
          # The action may fail or succeed depending on event context.
          # Under workflow_dispatch, it typically exits with an unsupported event message.
          # We just verify it ran (outcome is set) and did not produce an unexpected crash.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with COMMENT_TEMPLATE input"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
