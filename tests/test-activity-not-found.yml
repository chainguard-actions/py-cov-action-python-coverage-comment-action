name: Test activity auto-detection with unknown event (workflow_dispatch)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ github.token }}
          # No ACTIVITY specified — auto-detection will be used.
          # Under act, GITHUB_EVENT_NAME is workflow_dispatch, which is not
          # in the known set (pull_request, push, merge_group, workflow_run, schedule).
          # get_repository_info() is called first and fails on the sentinel repo (404),
          # OR ActivityNotFound is raised for workflow_dispatch event.
          # Either way, failure is expected.
          COVERAGE_PATH: "."

      - name: Assert action failed (ActivityNotFound or sentinel repo not resolvable)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because:
          # 1. get_repository_info() hits the sentinel repo API (404), OR
          # 2. ActivityNotFound is raised for workflow_dispatch event
          # Either way, failure is the expected outcome.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action unexpectedly succeeded with workflow_dispatch event and no ACTIVITY override"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
