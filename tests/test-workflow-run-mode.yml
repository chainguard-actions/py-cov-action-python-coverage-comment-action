name: Test workflow_run mode with GITHUB_PR_RUN_ID
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: workflow_run
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          GITHUB_TOKEN: fake-token-for-input-coverage
          GITHUB_PR_RUN_ID: "12345"
          COVERAGE_DATA_BRANCH: python-coverage-comment-action-data

      - name: Assert action accepted GITHUB_PR_RUN_ID input
        run: |
          echo "Action completed (possibly with error due to fake token/run-id)"
          echo "activity_run output: ${{ steps.action.outputs.activity_run }}"
          echo "PASS: GITHUB_PR_RUN_ID input was accepted by the action"
