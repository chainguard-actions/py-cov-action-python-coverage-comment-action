name: Test pull request mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_REPOSITORY: test-owner/test-repo
      GITHUB_BASE_REF: main
      GITHUB_HEAD_REF: feature-branch
      GITHUB_STEP_SUMMARY: /tmp/step-summary.md
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action in pull_request mode (expects failure due to fake token)
        id: action
        uses: .
        continue-on-error: true
        with:
          GITHUB_TOKEN: fake-token-for-testing

      - name: Assert action failed (expected due to fake token / no real PR)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when using a fake GitHub token"
            exit 1
          fi
          echo "PASS: action correctly failed when using a fake GitHub token in PR mode"
