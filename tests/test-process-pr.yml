name: Test process_pr activity
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Generate a coverage data file
        run: |
          set -e
          mkdir -p cov-project
          cd cov-project
          cat > .coveragerc <<'EOF'
          [run]
          relative_files = true
          EOF
          cat > mymod.py <<'EOF'
          def add(a, b):
              return a + b


          def unused(x):
              if x:
                  return 1
              return 2
          EOF
          cat > run_it.py <<'EOF'
          import mymod
          assert mymod.add(1, 2) == 3
          EOF
          python3 -m venv /tmp/covenv
          /tmp/covenv/bin/pip install --quiet coverage
          /tmp/covenv/bin/coverage run run_it.py
          ls -la
          test -f .coverage
      - id: action
        uses: .
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ github.token }}
          ACTIVITY: process_pr
          COVERAGE_PATH: cov-project
          MINIMUM_GREEN: "90"
          MINIMUM_ORANGE: "50"
      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          RESULT: ${{ steps.action.outputs.activity_run }}
          PERCENT: ${{ steps.action.outputs.new_percent_covered }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "activity_run: $RESULT"
          echo "new_percent_covered: $PERCENT"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$RESULT" != "process_pr" ]; then
              echo "FAIL: expected activity_run=process_pr"
              exit 1
            fi
            if [ -z "$PERCENT" ]; then
              echo "FAIL: new_percent_covered is empty"
              exit 1
            fi
            echo "PASS: process_pr ran with coverage $PERCENT"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
