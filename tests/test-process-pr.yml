name: Test process_pr activity
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action calls the GitHub API (get_repository_info) before processing.
      # With the sentinel GITHUB_REPOSITORY, this will fail with a 404.
      # We accept either success or graceful failure.
      - id: action
        uses: .
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ github.token }}
          ACTIVITY: process_pr
          MINIMUM_GREEN: "80"
          MINIMUM_ORANGE: "50"

      - name: Assert action ran or failed gracefully on sentinel repo
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ACTIVITY_RUN: ${{ steps.action.outputs.activity_run }}
          NEW_PERCENT: ${{ steps.action.outputs.new_percent_covered }}
        run: |
          echo "outcome: $OUTCOME"
          echo "activity_run: $ACTIVITY_RUN"
          echo "new_percent_covered: $NEW_PERCENT"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$ACTIVITY_RUN" != "process_pr" ]; then
              echo "FAIL: expected activity_run='process_pr' but got '$ACTIVITY_RUN'"
              exit 1
            fi
            echo "PASS: action succeeded with activity_run='process_pr'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          elif [ "$OUTCOME" = "skipped" ] || [ -z "$OUTCOME" ]; then
            echo "PASS: action step was skipped or outcome not available (Docker build may have failed)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
