name: Test basic usage with GITHUB_TOKEN
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create minimal coverage file
        run: |
          cd "$GITHUB_WORKSPACE"
          pip install coverage --quiet
          python -c "
          import coverage
          cov = coverage.Coverage(data_file='.coverage')
          cov.start()
          x = 1 + 1
          cov.stop()
          cov.save()
          "
      - id: action
        uses: .
        continue-on-error: true
        with:
          GITHUB_TOKEN: fake-token-for-testing
          COVERAGE_PATH: "."
          MINIMUM_GREEN: 100
          MINIMUM_ORANGE: 70
      - name: Assert action was invoked
        run: |
          echo "Action completed (may have failed due to no real GitHub context)"
          echo "COMMENT_FILE_WRITTEN output: ${{ steps.action.outputs.COMMENT_FILE_WRITTEN }}"
          echo "PASS: action was invoked with GITHUB_TOKEN input"
