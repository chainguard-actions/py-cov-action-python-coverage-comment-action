name: Test post_comment activity with GITHUB_PR_RUN_ID
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ github.token }}
          # Explicitly request post_comment activity with a GITHUB_PR_RUN_ID value
          ACTIVITY: post_comment
          GITHUB_PR_RUN_ID: "12345678"

      - name: Assert action ran (GITHUB_PR_RUN_ID was accepted, or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ACTIVITY_RUN: ${{ steps.action.outputs.activity_run }}
        run: |
          echo "outcome: $OUTCOME"
          echo "activity_run: $ACTIVITY_RUN"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$ACTIVITY_RUN" != "post_comment" ]; then
              echo "FAIL: expected activity_run='post_comment' but got '$ACTIVITY_RUN'"
              exit 1
            fi
            echo "PASS: action succeeded with activity_run='$ACTIVITY_RUN'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
