name: Test post_comment with GITHUB_PR_RUN_ID
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ github.token }}
          ACTIVITY: post_comment
          GITHUB_PR_RUN_ID: "123456789"
      - name: Assert action ran (or failed gracefully on the sentinel repo)
        env:
          RESULT: ${{ steps.action.outputs.activity_run }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "activity_run: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$RESULT" != "post_comment" ]; then
              echo "FAIL: expected activity_run=post_comment"
              exit 1
            fi
            echo "PASS: post_comment ran"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo / fake run id not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
