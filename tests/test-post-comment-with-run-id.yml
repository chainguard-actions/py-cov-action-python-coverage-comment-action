name: Test post_comment activity with GITHUB_PR_RUN_ID
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Pass GITHUB_PR_RUN_ID to the action in post_comment mode.
      # The action calls the GitHub API (get_repository_info) which will fail
      # with the sentinel GITHUB_REPOSITORY (404). Even if the API call were to
      # succeed, the run ID 1 is unlikely to have a valid coverage artifact.
      # We accept either graceful failure or success.
      - id: action
        uses: .
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ github.token }}
          ACTIVITY: post_comment
          GITHUB_PR_RUN_ID: "1"

      - name: Assert action ran or failed gracefully
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ACTIVITY_RUN: ${{ steps.action.outputs.activity_run }}
        run: |
          echo "outcome: $OUTCOME"
          echo "activity_run: $ACTIVITY_RUN"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$ACTIVITY_RUN" != "post_comment" ]; then
              echo "FAIL: expected activity_run='post_comment' but got '$ACTIVITY_RUN'"
              exit 1
            fi
            echo "PASS: action succeeded with GITHUB_PR_RUN_ID and activity_run='post_comment'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo not resolvable or run ID invalid)"
          elif [ "$OUTCOME" = "skipped" ] || [ -z "$OUTCOME" ]; then
            echo "PASS: action step was skipped or outcome not available (Docker build may have failed)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
