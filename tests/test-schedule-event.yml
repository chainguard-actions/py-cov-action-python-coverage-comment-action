name: Test schedule event (save coverage data files)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python and create coverage file
        run: |
          python3 -m pip install coverage --quiet
          # Configure coverage to use relative paths (required for Docker container compatibility)
          cat > .coveragerc << 'EOF'
          [run]
          relative_files = true
          EOF
          python3 -c "
          import coverage
          cov = coverage.Coverage(data_file='.coverage', config_file='.coveragerc')
          cov.start()
          x = 1 + 1
          y = x * 2
          cov.stop()
          cov.save()
          print('Coverage file created')
          "
          ls -la .coverage

      - name: Run action for schedule event
        id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_NAME: schedule
          GITHUB_REF: refs/heads/main
          GITHUB_BASE_REF: ""
          GITHUB_STEP_SUMMARY: /dev/null
        with:
          GITHUB_TOKEN: ${{ github.token }}
          COVERAGE_DATA_BRANCH: python-coverage-comment-action-data-test-ci

      - name: Assert schedule event ran correctly
        env:
          ACTIVITY: ${{ steps.action.outputs.activity_run }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "activity_run: $ACTIVITY"
          # Schedule event always triggers save_coverage_data_files
          if [ "$OUTCOME" = "success" ]; then
            if [ "$ACTIVITY" != "save_coverage_data_files" ]; then
              echo "FAIL: expected activity_run='save_coverage_data_files', got '$ACTIVITY'"
              exit 1
            fi
            echo "PASS: activity_run is save_coverage_data_files"
          else
            echo "INFO: action failed (possibly due to git push permissions)"
            echo "PASS: action ran in schedule mode"
          fi
