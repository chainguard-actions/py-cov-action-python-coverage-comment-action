name: Test invalid event name (workflow_dispatch not supported)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with unsupported event (workflow_dispatch)
        id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_NAME: workflow_dispatch
          GITHUB_REF: refs/heads/act-harness
          GITHUB_BASE_REF: ""
          GITHUB_STEP_SUMMARY: /dev/null
        with:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert action failed for unsupported event
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for unsupported event 'workflow_dispatch'"
            exit 1
          fi
          echo "PASS: action correctly failed for unsupported event 'workflow_dispatch'"
